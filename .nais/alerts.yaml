apiVersion: nais.io/v1
kind: Alert
metadata:
  name: nav-etterlevelse-mcp-alerts
  namespace: dab
  labels:
    team: dab
    app: nav-etterlevelse-mcp
spec:
  receivers:
    slack:
      channel: "#team_dab_alerts_dev"
      prependText: ""
  alerts:
    - alert: EtterlevelseMcpHighErrorRate
      expr: |
        rate(mcp_errors_total{namespace="dab", app="nav-etterlevelse-mcp"}[5m])
        / rate(mcp_requests_total{namespace="dab", app="nav-etterlevelse-mcp"}[5m]) > 0.10
      for: 5m
      severity: warning
      description: "Feilrate er over 10% siste 5 min. Sjekk logger for feiltype."
      action: "Sjekk Grafana Loki: {app=\"nav-etterlevelse-mcp\", namespace=\"dab\"}"

    - alert: EtterlevelseMcpTexasOboErrors
      expr: rate(texas_obo_errors_total{namespace="dab", app="nav-etterlevelse-mcp"}[5m]) > 0
      for: 2m
      severity: critical
      description: "OBO-veksling feiler — brukere kan ikke autentisere mot etterlevelse. Sjekk Texas-sidecar og Azure AD."
      action: "Sjekk NAIS Console for Texas-sidecar status og logger"

    - alert: EtterlevelseMcpNoTraffic
      expr: rate(mcp_requests_total{namespace="dab", app="nav-etterlevelse-mcp"}[24h]) == 0
      for: 24h
      severity: info
      description: "Enten er løsningen ikke i bruk, eller noe er galt med tilkoblingen. Verifiser at MCP-serveren svarer."
      action: "Sjekk https://nav-etterlevelse-mcp.intern.dev.nav.no/health"
